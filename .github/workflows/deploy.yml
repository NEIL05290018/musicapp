name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup npm mirror
        run: npm config set registry https://registry.npmmirror.com

      - name: Verify Node.js
        run: node --version && npm --version

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Deploy frontend
        run: |
          mkdir -p /www/wwwroot/musicapp
          rm -rf /www/wwwroot/musicapp/*
          cp -r dist/* /www/wwwroot/musicapp/

      - name: Setup backend directories
        run: mkdir -p /opt/audiosift/{backend,uploads,outputs,logs}

      - name: Deploy backend
        run: cp -f backend/*.py /opt/audiosift/backend/


