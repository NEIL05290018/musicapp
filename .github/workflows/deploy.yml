name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add Runner Node.js to PATH
        run: echo "/opt/actions-runner/externals/node20/bin" >> $GITHUB_PATH

      - name: Verify Node.js
        run: node --version && npm --version

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Deploy frontend
        run: |
          rm -rf /opt/audiosift/frontend/*
          cp -r dist/* /opt/audiosift/frontend/

      - name: Deploy backend
        run: |
          cp -f backend/*.py /opt/audiosift/backend/

      - name: Restart backend service
        run: systemctl restart audiosift

      - name: Verify deployment
        run: |
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/api/health
          echo ""
          echo "=== Deploy completed ==="
