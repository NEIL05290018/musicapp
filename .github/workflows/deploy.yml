name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup npm mirror
        run: npm config set registry https://registry.npmmirror.com

      - name: Verify Node.js
        run: node --version && npm --version

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Deploy frontend
        run: |
          mkdir -p /opt/audiosift/frontend
          rm -rf /opt/audiosift/frontend/*
          cp -r dist/* /opt/audiosift/frontend/

      - name: Deploy backend
        run: |
          mkdir -p /opt/audiosift/backend
          cp -f backend/*.py /opt/audiosift/backend/

      - name: Setup backend Python venv
        run: |
          python3 -m venv /opt/audiosift/venv
          /opt/audiosift/venv/bin/pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            /opt/audiosift/venv/bin/pip install -r backend/requirements.txt
          fi

      - name: Install systemd service
        run: |
          sudo cp .github/deploy/audiosift.service /etc/systemd/system/audiosift.service
          sudo systemctl daemon-reload
          sudo systemctl enable audiosift.service

      - name: Restart backend service
        run: sudo systemctl restart audiosift.service

      - name: Verify deployment
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health)
            if [ "$code" = "200" ]; then
              echo "Health check passed: $code"
              echo "=== Deploy completed ==="
              exit 0
            fi
            echo "Attempt $i: got $code, retrying in 3s..."
            sleep 3
          done
          echo "Health check failed after 5 attempts"
          exit 1
